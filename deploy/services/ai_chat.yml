# Production companion peer — Nervas + identity + Postgres.
services:
  ai_chat:
    build:
      context: .
      dockerfile: deploy/docker/Dockerfile.python
      target: runtime
      args:
        SERVICE_APP: services.ai_chat.src.api.main:create_app
        SERVICE_PORT: "8035"
    restart: unless-stopped
    user: "1000:1000"
    networks: [empery_net]
    ports:
      - "8035:8035"
    depends_on:
      - redis
      - postgres
      - empery_intelligence_core
      - identity_service
    environment:
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      EVENT_BUS_REDIS_URL: redis://redis:6379/0
      REDIS_URL: redis://redis:6379/0
      EVENT_BUS_ALLOW_IN_MEMORY: "false"
      AUTO_CREATE_TABLES: "false"
      PYTHONUNBUFFERED: "1"
      PORT: "8035"
      AI_CHAT_PORT: "8035"
      EIC_API_BASE: ${EIC_API_BASE:-http://empery_intelligence_core:8007}
      IDENTITY_API_BASE: ${IDENTITY_API_BASE:-http://identity_service:8003}
      IDENTITY_MODE: ${IDENTITY_MODE:-http}
      AI_CHAT_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-eworld}:${POSTGRES_PASSWORD}@postgres:5432/ai_chat
      AI_CHAT_CORS_ORIGINS: ${AI_CHAT_CORS_ORIGINS:-http://127.0.0.1:5174,http://localhost:5174,http://127.0.0.1:5175,http://localhost:5175,http://127.0.0.1:5173,http://localhost:5173,http://192.168.1.136:5173,http://192.168.1.136:5174,http://192.168.1.136:5175}
