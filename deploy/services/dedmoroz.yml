# Ded Moroz companion — Nervas + Postgres (production path).
services:
  dedmoroz:
    build:
      context: .
      dockerfile: deploy/docker/Dockerfile.python
      target: runtime
      args:
        SERVICE_APP: services.dedmoroz.src.api.main:create_app
        SERVICE_PORT: "8039"
    restart: unless-stopped
    user: "1000:1000"
    networks: [empery_net]
    ports:
      - "8039:8039"
    depends_on:
      - redis
      - postgres
      - empery_intelligence_core
    environment:
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      EVENT_BUS_REDIS_URL: redis://redis:6379/0
      REDIS_URL: redis://redis:6379/0
      EVENT_BUS_ALLOW_IN_MEMORY: "false"
      AUTO_CREATE_TABLES: "false"
      PYTHONUNBUFFERED: "1"
      PORT: "8039"
      DEDMOROZ_PORT: "8039"
      EIC_API_BASE: ${EIC_API_BASE:-http://empery_intelligence_core:8007}
      DEDMOROZ_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-eworld}:${POSTGRES_PASSWORD}@postgres:5432/dedmoroz
      DEDMOROZ_CORS_ORIGINS: ${DEDMOROZ_CORS_ORIGINS:-http://127.0.0.1:5174,http://localhost:5174,http://127.0.0.1:5175,http://localhost:5175,http://192.168.1.136:5174,http://192.168.1.136:5175,http://192.168.8.10:5174,http://192.168.8.10:5175}
