services:
  desktop_shell:
    build:
      context: .
      dockerfile: deploy/docker/Dockerfile.python
      target: runtime
      args:
        SERVICE_APP: services.desktop_shell.src.api.main:create_app
        SERVICE_PORT: "8020"
    restart: unless-stopped
    user: "1000:1000"
    networks: [empery_net]
    ports:
      - "8020:8020"
    depends_on:
      - redis
    volumes:
      - ./.cursor/orchestration/eic/desktop_catalog:/app/desktop_catalog:z
    environment:
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      EVENT_BUS_REDIS_URL: redis://redis:6379/0
      REDIS_URL: redis://redis:6379/0
      EVENT_BUS_ALLOW_IN_MEMORY: "false"
      AUTO_CREATE_TABLES: "false"
      PYTHONUNBUFFERED: "1"
      PORT: "8020"
      DESKTOP_SHELL_PORT: "8020"
      DESKTOP_CATALOG_DIR: /app/desktop_catalog
      DESKTOP_SHELL_CORS_ORIGINS: ${DESKTOP_SHELL_CORS_ORIGINS:-http://127.0.0.1:5174,http://localhost:5174,http://127.0.0.1:5175,http://localhost:5175,http://192.168.1.136:5174,http://192.168.1.136:5175,http://192.168.8.10:5174,http://192.168.8.10:5175}
