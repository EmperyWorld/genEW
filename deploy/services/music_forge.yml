services:
  music_forge:
    build:
      context: .
      dockerfile: deploy/docker/Dockerfile.python
      target: runtime
      args:
        SERVICE_APP: services.music_forge.src.api.main:create_app
        SERVICE_PORT: "8023"
    restart: unless-stopped
    user: "1000:1000"
    networks: [empery_net]
    ports:
      - "8023:8023"
    depends_on:
      - redis
    volumes:
      - ./services/music_forge/workflows:/app/services/music_forge/workflows:ro,z
    environment:
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      EVENT_BUS_REDIS_URL: redis://redis:6379/0
      REDIS_URL: redis://redis:6379/0
      EVENT_BUS_ALLOW_IN_MEMORY: "false"
      AUTO_CREATE_TABLES: "false"
      PYTHONUNBUFFERED: "1"
      PORT: "8023"
      MUSIC_FORGE_PORT: "8023"
      COMFY_BASE_URL: ${COMFY_BASE_URL:-http://host.containers.internal:31003}
      MUSIC_FORGE_CORS_ORIGINS: ${MUSIC_FORGE_CORS_ORIGINS:-http://127.0.0.1:5174,http://localhost:5174}
