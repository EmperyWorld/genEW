[alembic]
script_location = %(here)s/alembic
prepend_sys_path = .
version_path_separator = os

sqlalchemy.url = postgresql+psycopg://eworld:eworld@localhost:5432/core_auth

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = json

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = json

[formatter_json]
format = %(message)s
