# P18 law: product pack without a PASSED golden report is not assembly-active.
# Cross-cutting laws + platform/peer adapters stay always_active.
# Reports live under .cursor/orchestration/reports/ (repo-relative).

version: 1

always_active:
  # Cross-cutting laws
  - service_anatomy
  - desktop_mount_catalog
  - verify_gates
  - service_factory
  # Platform / shell (not newborn product genesis)
