# Machine-readable atom catalog — pack → EliteEW upstream → reference extract → Empery targets.
# Hands genesis uses extract_globs under reference/; corpus sync may use upstream_eliteew_globs.
# Never edit EliteEW in place. Never import reference/ at runtime.

eliteew_root_env: ELITEEW_ROOT
eliteew_root_default: /home/owned/powered_by_emperyworld/EliteEW

packs:
  - pack: ewa_companion
    scaffold_profile: companion_chat
    upstream_eliteew_globs:
      - web/frontend/src/features/ewa/EwaCompanionChatPanel.tsx
      - web/frontend/src/features/ewa/EwaCompanionChatMarkdown.tsx
      - web/frontend/src/features/desktop-ai-chat/DesktopAiChatApp.tsx
      - api/ewa_platform/gateways/routers/companion_chat.py
      - api/domains/chat.py
    extract_globs:
      - reference/eliteew/packs/ewa_companion/upstream_fe/**
      - reference/eliteew/packs/ewa_companion/upstream_api/**
      - reference/eliteew/packs/ewa_companion/slim/**
      - reference/eliteew/packs/ewa_companion/desktop_mount/**
    empery_targets:
      - apps/empery_desktop/atoms/
      - services/{service_name}/
    transforms:
      - strip_reference_imports
      - rewrite_service_token

  - pack: nervas_llm_peer
    scaffold_profile: peer_http
    upstream_eliteew_globs: []
    extract_globs:
      - core/integration/nervas.py
    empery_targets:
      - services/{service_name}/src/integration/
    transforms:
      - rewrite_service_token

  - pack: ewgen_factory
    scaffold_profile: health_probe
    upstream_eliteew_globs: []
    extract_globs:
      - reference/ewgen/SOURCE.md
      - reference/ewgen/docs/**
    empery_targets:
      - services/{service_name}/src/integration/atoms/
    transforms:
      - strip_reference_imports

  - pack: studios
